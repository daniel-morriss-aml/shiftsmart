<app-modal [isOpen]="isOpen()" [title]="title()" [maxWidth]="'md'" (close)="onCancel()">
    <div class="space-y-4">
        <p class="text-gray-700">{{ message() }}</p>

        <div class="flex justify-end gap-3 pt-4">
            <button type="button" (click)="onCancel()" class="btn btn-secondary btn-sm">
                {{ cancelText() }}
            </button>
            <button type="button" (click)="onConfirm()" class="btn btn-danger btn-sm">
                {{ confirmText() }}
            </button>
        </div>
    </div>
</app-modal>
