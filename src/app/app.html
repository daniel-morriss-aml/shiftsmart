<div class="min-h-screen bg-slate-100 text-slate-900">
    <header
        class="bg-gradient-to-r from-slate-950 via-sky-950 to-indigo-950 text-white shadow-lg ring-1 ring-white/10"
    >
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                <div class="flex items-center gap-3">
                    <div
                        class="flex h-11 w-11 items-center justify-center rounded-xl bg-cyan-400/15 ring-1 ring-cyan-300/40 shadow-lg shadow-cyan-500/20"
                    >
                        <span class="text-lg font-bold text-cyan-200">S</span>
                    </div>
                    <div>
                        <p class="text-2xl font-bold tracking-tight text-white">ShiftSmart</p>
                        <p class="text-sm text-slate-300">Hospital Rota Builder</p>
                    </div>
                </div>

                <nav class="flex flex-wrap items-center gap-2" aria-label="Main navigation">
                    <a
                        routerLink="/staff"
                        routerLinkActive="is-active"
                        [routerLinkActiveOptions]="{ exact: false }"
                        class="btn btn-nav"
                    >
                        Staff
                    </a>
                    <a
                        routerLink="/shift-setup"
                        routerLinkActive="is-active"
                        [routerLinkActiveOptions]="{ exact: false }"
                        class="btn btn-nav"
                    >
                        Shift Setup
                    </a>
                    <a
                        routerLink="/generate-rota"
                        routerLinkActive="is-active"
                        [routerLinkActiveOptions]="{ exact: false }"
                        class="btn btn-nav"
                    >
                        Rota
                    </a>
                    <a
                        routerLink="/settings"
                        routerLinkActive="is-active"
                        [routerLinkActiveOptions]="{ exact: false }"
                        class="btn btn-nav"
                    >
                        Settings
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 lg:py-8">
        <div class="app-shell">
            <router-outlet />
        </div>
    </main>
</div>
